services:
  sentiguard-nlp:
    build: .
    image: sentiguard:latest
    container_name: sentiguard_nlp
    environment:
      - MAX_TEXT_LEN=100000
    # По умолчанию слушаем только локально. Наружу отдавать через обратный прокси с авторизацией.
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    mem_limit: 1500m
    restart: unless-stopped
